name: validate task

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image, rebuild manifest, run all checks
        working-directory: task-jmespath-let
        run: ./run_checks.sh
      - name: Verifiers wrapper tests
        working-directory: env-verifiers
        run: |
          python3 -m pip install --quiet uv
          uv venv --python 3.12 .venv
          . .venv/bin/activate
          uv pip install --quiet -e . pytest
          python -m pytest tests -q -p no:cacheprovider
      - name: Upload grading reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grading-reports
          path: task-jmespath-let/.reports/*.json
