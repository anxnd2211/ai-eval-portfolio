[project]
name = "jmespath-let-env"
version = "0.1.0"
description = "verifiers v1 taskset: the jmespath.py let-expressions task, graded by its tamper-resistant Docker grader."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jmespath_let_env"]
